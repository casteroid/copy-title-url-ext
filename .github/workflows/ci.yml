name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check commit messages
        uses: casteroid/webext-release/lint-commits@08dbf20cfed9cbcf0407529d222cc9d53f085577 # v1.0.0

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - name: Build and package
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: packages/*
          if-no-files-found: error
