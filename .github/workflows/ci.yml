name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # New branch, or a force push left the old tip unreachable: check everything since the
            # last release tag. "Initial commit" and "Create LICENSE" predate the convention.
            range="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$AFTER")..$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          npm run lint:commits -- "$range"

      - run: npm run typecheck

      - run: npm test

      - name: Build and package
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: packages/*
          if-no-files-found: error
