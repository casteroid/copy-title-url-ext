name: Release

# Started by hand from the Actions tab. The shared workflow works out the next version from Conventional Commits,
# commits the version bump, tags it, creates a GitHub release with the Chrome zip and the Firefox xpi, then uploads
# them to the Chrome Web Store and Firefox Add-ons. See https://github.com/casteroid/webext-release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: auto derives it from commits since the last tag"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Dry run: only show the version and notes that would be released"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: casteroid/webext-release/.github/workflows/release.yml@6d7e6dc000cfd09f1642b0182ec57912c68b9d2c # v1.0.1
    with:
      manifest: app/manifest.json
      check: npm run typecheck && npm test
      package: npm run package
      artifacts: packages/*
      chrome-package: "*.chrome.zip"
      firefox-package: "*.firefox.xpi"
      bump: ${{ inputs.bump }}
      dry-run: ${{ inputs.dry_run }}
    secrets:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
